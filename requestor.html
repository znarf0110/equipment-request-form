<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Requestor Dashboard</title>
<style>
/* --- Dashboard Specific Styles --- */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    margin: 0;
}
.container {
    background: white;
    padding: 30px;
    width: 900px;
    max-width: 90%; /* Added max-width for responsiveness */
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}
h2 { 
    text-align: center;
    margin-bottom: 25px; 
}

/* --- FLEXBOX FOR NAME | DATE LAYOUT --- */
.requestor-info {
    display: flex;
    gap: 20px; /* Space between the two field groups */
    margin-bottom: 20px;
    align-items: center;
}
.field-group {
    flex: 1; /* Makes both groups take equal width */
    display: flex;
    align-items: center;
}
.field-group label {
    margin-right: 10px;
    font-weight: bold;
    white-space: nowrap; /* Prevents label from wrapping */
}
.field-group input {
    /* Reset width for Flexbox context */
    width: 100%; 
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    margin: 0; /* Remove default margin */
}

/* --- User Info Display --- */
.user-status {
    text-align: right;
    font-size: 0.9em;
    color: #555;
    margin-bottom: 15px;
}

button {
    width: 150px;
    padding: 10px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: block; /* REQUIRED: Makes the button respect margin: auto */
    margin: 20px auto 0; /* Centers horizontally (left/right auto) and sets top margin (20px) */

}
	
.logout-btn {
    width: 80px; 
    padding: 10px;
    background: #dc3545; 
    color: white; 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 14px; 
    float: right; 
    margin-top: 20px; 
    text-align: center;
}

	
</style>
</head>
<body>
	
<div class="container">
  <button class="logout-btn" onclick="logout()">Logout</button>
  <div class="user-status">Logged in as: <strong id="user-email">Loading...</strong></div>

  <h2>Requestor Dashboard</h2>

  <div class="requestor-info">
    <div class="field-group">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Requestor Name">
    </div>
    <div class="field-group">
      <label for="date">Date Needed:</label>
      <input type="date" id="date">
    </div>
  </div>

  <div class="requestor-info">
    <div class="field-group">
      <label for="department">Department:</label>
      <input type="text" id="department" placeholder="Requestor Department">
    </div>
    <div class="field-group">
      <label for="location">Location</label>
      <input type="text" id="location">
    </div>
  </div>

  <button onclick="Submit()">Submit Request</button>
  <p id="message"></p>
</div>

<script>
auth.onAuthStateChanged(async user=>{
    if(!user) return window.location.href="index.html";
    const doc = await db.collection("Accounts").doc(user.uid).get();
    if(doc.data().role!=="requestor") return window.location.href="index.html";
    // preselect department if needed
    document.getElementById("department").value = doc.data().department || "";
});

function logout(){ auth.signOut(); window.location.href="index.html"; }

function submitRequest(){
    const name = document.getElementById("name").value.trim();
    const dateNeeded = document.getElementById("date").value;
    const department = document.getElementById("department").value;
    const location = document.getElementById("location").value.trim();
    const msg = document.getElementById("message");

    if(!name||!dateNeeded||!department||!location){
        msg.innerText="All fields are required."; msg.style.color="red"; return;
    }

    const user = auth.currentUser;
    db.collection("Accounts").doc(user.uid).get().then(doc=>{
        const username = doc.data().username;
        const dept = doc.data().department;

        db.collection("Requests").add({
            name, dateNeeded, department:dept, location,
            submittedBy: username, userId:user.uid,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: { approver1:"Pending", approver2:"Pending", final:"Pending" }
        }).then(()=>{ msg.innerText="Request submitted!"; msg.style.color="green"; });
    });
}
</script>
	
</body>
</html>
