<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Requestor Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container {
  background:white;
  padding:30px;
  width:900px;
  max-width:90%;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
h2 { text-align:center; }
.requestor-info {
  display:flex;
  gap:20px;
  margin-bottom:20px;
}
.field-group { flex:1; }
label { font-weight:bold; }
input, select {
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
}
button {
  width:200px;
  padding:10px;
  background:#007bff;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:20px auto;
  display:block;
}
.logout-btn {
  float:right;
  background:#dc3545;
  width:80px;
}
#message { text-align:center; margin-top:10px; }
</style>
</head>

<body>

<div class="container">
  <button class="logout-btn" onclick="logout()">Logout</button>
  <div>Logged in as: <strong id="user-email">...</strong></div>

  <h2>Requestor Dashboard</h2>

  <div class="requestor-info">
    <div class="field-group">
      <label>Name</label>
      <input id="name">
    </div>
    <div class="field-group">
      <label>Date Needed</label>
      <input type="date" id="date">
    </div>
  </div>

  <div class="requestor-info">
    <div class="field-group">
      <label>Department</label>
      <select id="department">
        <option value="">Select</option>
        <option value="Sales">Sales</option>
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="FINANCE">FINANCE</option>
        <option value="OPERATIONS">OPERATIONS</option>
      </select>
    </div>
    <div class="field-group">
      <label>Location</label>
      <input id="location">
    </div>
  </div>

  <button onclick="submitRequest()">Submit Request</button>
  <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
auth.onAuthStateChanged(async user => {
  if (!user) return location.href = "index.html";

  const doc = await db.collection("Accounts").doc(user.uid).get();
  const data = doc.data();

  if (!data || data.role !== "requestor")
    return location.href = "index.html";

  document.getElementById("user-email").innerText =
    data.username || user.email;

  if (data.department)
    document.getElementById("department").value =
      data.department.toUpperCase();
});

function submitRequest() {
  const name = nameInput.value.trim();
  const dateNeeded = date.value;
  const department = departmentSelect.value.toUpperCase();
  const location = locationInput.value.trim();
  const msg = document.getElementById("message");

  if (!name || !dateNeeded || !department || !location) {
    msg.innerText = "All fields are required";
    msg.style.color = "red";
    return;
  }

  const user = auth.currentUser;

  db.collection("Accounts").doc(user.uid).get().then(doc => {
    const username = doc.data().username;

    db.collection("Requests").add({
      name,
      dateNeeded,
      department,
      location,
      submittedBy: username,
      userId: user.uid,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      status: {
        approver1: "Pending",
        approver2: "Pending",
        final: "Pending"
      },
      currentApprover: "Manager",
      approverKey: `${department}_MANAGER`
    }).then(() => {
      msg.innerText = "Request submitted successfully!";
      msg.style.color = "green";
    });
  });
}

const nameInput = document.getElementById("name");
const date = document.getElementById("date");
const departmentSelect = document.getElementById("department");
const locationInput = document.getElementById("location");

function logout() {
  auth.signOut();
  location.href = "index.html";
}
</script>
</body>
</html>
