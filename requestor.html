<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Requestor Dashboard</title>
<style>
body { font-family: Arial; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.container { background:white; padding:30px; width:900px; max-width:90%; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
h2 { text-align:center; margin-bottom:25px; }
.requestor-info { display:flex; gap:20px; margin-bottom:20px; align-items:center; }
.field-group { flex:1; display:flex; align-items:center; }
.field-group label { margin-right:10px; font-weight:bold; white-space:nowrap; }
.field-group input, .field-group select { width:100%; padding:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; margin:0; }
.user-status { text-align:right; font-size:0.9em; color:#555; margin-bottom:15px; }
button { width:150px; padding:10px; background:#dc3545; color:white; border:none; border-radius:6px; cursor:pointer; font-size:16px; display:block; margin:20px auto 0; }
.logout-btn { width:80px; padding:10px; background:#dc3545; color:white; border:none; border-radius:6px; cursor:pointer; font-size:14px; float:right; margin-top:20px; text-align:center; }
</style>
</head>
<body>

<div class="container">
  <button class="logout-btn" onclick="logout()">Logout</button>
  <div class="user-status">Logged in as: <strong id="user-email">Loading...</strong></div>

  <h2>Requestor Dashboard</h2>

  <div class="requestor-info">
    <div class="field-group">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Requestor Name">
    </div>
    <div class="field-group">
      <label for="date">Date Needed:</label>
      <input type="date" id="date">
    </div>
  </div>

  <div class="requestor-info">
    <div class="field-group">
      <label for="department">Department:</label>
      <select id="department">
        <option value="">Select Department</option>
        <option value="Sales">Sales</option>
        <option value="Marketing">Marketing</option>
        <option value="HR">HR</option>
        <option value="Finance">Finance</option>
        <option value="IT">IT</option>
        <option value="Operations">Operations</option>
      </select>
    </div>

    <div class="field-group">
      <label for="location">Location:</label>
      <input type="text" id="location" placeholder="Location">
    </div>
  </div>

  <button onclick="submitRequest()">Submit Request</button>
  <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
auth.onAuthStateChanged(async user => {
    if(!user) return window.location.href="index.html";
    const doc = await db.collection("Accounts").doc(user.uid).get();
    const data = doc.data();
    if(!data || data.role !== "requestor") return window.location.href="index.html";
    document.getElementById("user-email").innerText = data.username || user.email;
    if(data.department) document.getElementById("department").value = data.department;
});

function logout(){ auth.signOut(); window.location.href="index.html"; }

function submitRequest() {
    const name = document.getElementById("name").value.trim();
    const dateNeeded = document.getElementById("date").value;
    const department = document.getElementById("department").value;
    const location = document.getElementById("location").value.trim();
    const msg = document.getElementById("message");
    if(!name || !dateNeeded || !department || !location){
        msg.innerText="All fields are required."; msg.style.color="red"; return;
    }
    const user = auth.currentUser;
    db.collection("Accounts").doc(user.uid).get().then(doc=>{
        const username = doc.data().username;
        db.collection("Requests").add({
            name, dateNeeded, department, location,
            submittedBy: username,
            userId:user.uid,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status:{approver1:"Pending",approver2:"Pending",final:"Pending"}
        }).then(()=>{
            msg.innerText="Request submitted successfully!"; msg.style.color="green";
            document.getElementById("name").value="";
            document.getElementById("date").value="";
            document.getElementById("department").value="";
            document.getElementById("location").value="";
        }).catch(e=>{msg.innerText="Error: "+e.message; msg.style.color="red";});
    });
}
</script>
</body>
</html>
