<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Requestor Dashboard</title>
<style>
/* --- Dashboard Specific Styles --- */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    margin: 0;
}
.container {
    background: white;
    padding: 30px;
    width: 900px;
    max-width: 90%; /* Added max-width for responsiveness */
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}
h2 { 
    text-align: center;
    margin-bottom: 25px; 
}

/* --- FLEXBOX FOR NAME | DATE LAYOUT --- */
.requestor-info {
    display: flex;
    gap: 20px; /* Space between the two field groups */
    margin-bottom: 20px;
    align-items: center;
}
.field-group {
    flex: 1; /* Makes both groups take equal width */
    display: flex;
    align-items: center;
}
.field-group label {
    margin-right: 10px;
    font-weight: bold;
    white-space: nowrap; /* Prevents label from wrapping */
}
.field-group input {
    /* Reset width for Flexbox context */
    width: 100%; 
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    margin: 0; /* Remove default margin */
}

/* --- User Info Display --- */
.user-status {
    text-align: right;
    font-size: 0.9em;
    color: #555;
    margin-bottom: 15px;
}

button {
    width: 150px;
    padding: 10px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: block; /* REQUIRED: Makes the button respect margin: auto */
    margin: 20px auto 0; /* Centers horizontally (left/right auto) and sets top margin (20px) */

}
	
.logout-btn {
    width: 80px; 
    padding: 10px;
    background: #dc3545; 
    color: white; 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 14px; 
    float: right; 
    margin-top: 20px; 
    text-align: center;
}

	
</style>
</head>
<body>
	
<div class="container">
	<button class="logout-btn" onclick="logout()">Logout</button>
    <div class="user-status">Logged in as: <strong id="user-email">Loading...</strong></div>

    <h2>Requestor Dashboard</h2>

    <div class="requestor-info">
        <div class="field-group">
            <label for="name">Name:</label>
            <input type="text" required id="name" placeholder="Requestor Name">
        </div>
        <div class="field-group">
            <label for="date">Date Needed:</label>
            <input type="date" required id="date">
        </div>
    </div>
	
    <div class="requestor-info">
        <div class="field-group">
            <label for="department">Department:</label>
            <input type="text" required id="department" placeholder="Requestor Department">
        </div>

        <div class="field-group">
            <label for="location">Location</label>
            <input type="text" required id="location">
        </div>
    </div>
        
    <button onclick="Submit()">Submit</button> 
    <div style="clear: both;"></div> 
    <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
	
<script>
auth.onAuthStateChanged(function(user) {
    if (user) {
        document.getElementById("user-email").innerText = user.email;

        // 🔥 Fetch username by EMAIL (matches login logic)
        db.collection("Accounts")
          .where("email", "==", user.email)
          .limit(1)
          .get()
          .then(snapshot => {
              if (!snapshot.empty) {
                  const username = snapshot.docs[0].data().username;
                  document.getElementById("user-email").innerText = username;
              } else {
                  console.log("No username found for this email.");
              }
          })
          .catch(error => {
              console.error("Error fetching username:", error);
          });

    } else {
        window.location.href = "index.html";
    }
});

function logout() {
    auth.signOut().catch(error => alert("Error logging out: " + error.message));
}
</script>



	
</body>
</html>
