<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Requestor Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container {
  background:white;
  padding:30px;
  width:900px;
  max-width:95%;
  border-radius:10px;
}
h2 { text-align:center; }
.row {
  display:flex;
  gap:20px;
  margin-bottom:15px;
}
label { font-weight:bold; }
input, select {
  width:100%;
  padding:10px;
}
button {
  display:block;
  margin:20px auto;
  padding:10px 20px;
  background:#007bff;
  color:white;
  border:none;
  border-radius:6px;
}
.logout {
  float:right;
  background:#dc3545;
}
#msg { text-align:center; }
</style>
</head>

<body>

<div class="container">
  <button class="logout" onclick="logout()">Logout</button>
  <div>Logged in as: <strong id="email"></strong></div>

  <h2>Requestor Dashboard</h2>

  <div class="row">
    <div>
      <label>Name</label>
      <input id="name">
    </div>
    <div>
      <label>Date Needed</label>
      <input type="date" id="date">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Department</label>
      <select id="department">
        <option value="">Select</option>
        <option value="SALES">SALES</option>
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="FINANCE">FINANCE</option>
        <option value="OPERATIONS">OPERATIONS</option>
      </select>
    </div>
    <div>
      <label>Location</label>
      <input id="location">
    </div>
  </div>

  <button onclick="submitRequest()">Submit Request</button>
  <p id="msg"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
auth.onAuthStateChanged(async user => {
  if (!user) return location.href="index.html";

  const snap = await db.collection("Accounts").doc(user.uid).get();
  const data = snap.data();

  if (!data || data.role !== "requestor")
    return location.href="index.html";

  document.getElementById("email").innerText =
    data.username || user.email;

  if (data.department)
    department.value = data.department.toUpperCase();
});

function submitRequest() {
  const msg = document.getElementById("msg");
  const dept = department.value.toUpperCase();

  if (!name.value || !date.value || !dept || !location.value) {
    msg.innerText = "All fields required";
    msg.style.color = "red";
    return;
  }

  const user = auth.currentUser;

  db.collection("Accounts").doc(user.uid).get().then(d => {
    db.collection("Requests").add({
      name: name.value,
      dateNeeded: date.value,
      department: dept,
      location: location.value,
      submittedBy: d.data().username,
      userId: user.uid,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      status: {
        approver1: "Pending",
        approver2: "Pending",
        final: "Pending"
      },
      currentApprover: "MANAGER",
      approverKey: `${dept}_MANAGER`
    });

    msg.innerText = "Request submitted!";
    msg.style.color = "green";
    name.value = date.value = location.value = "";
  });
}

function logout() {
  auth.signOut();
  location.href="index.html";
}
</script>
</body>
</html>
