<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
body { font-family: Arial; background:#f0f0f0; display:flex; justify-content:center; align-items:flex-start; padding-top:50px; margin:0; }
.container { background:white; padding:30px; border-radius:10px; width:900px; max-width:95%; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
h2 { text-align:center; margin-bottom:20px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { padding:10px; border:1px solid #ccc; text-align:left; }
.user-status { text-align:right; font-size:0.9em; color:#555; }
.logout-btn { width:80px; padding:10px; background:#dc3545; color:white; border:none; border-radius:6px; cursor:pointer; float:right; margin-top:0; }
</style>
</head>
<body>

<div class="container">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="user-status">Logged in as: <strong id="user-email">Loading...</strong></div>

    <h2>Admin Dashboard - All Requests</h2>

    <table>
        <thead>
            <tr>
                <th>Date Requested</th>
                <th>Requestor</th>
                <th>Department</th>
                <th>Location</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="requests-body">
            <tr><td colspan="5">Loading requests...</td></tr>
        </tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
// --- Auth & Role Protection ---
auth.onAuthStateChanged(async user => {
    if(!user) {
        // Not signed in
        window.location.href = "index.html";
        return;
    }

    // Show email temporarily
    document.getElementById("user-email").innerText = user.email;

    // Fetch user role
    const userDoc = await db.collection("Accounts").doc(user.uid).get();
    const userData = userDoc.data();

    if(!userData || userData.role !== "admin") {
        alert("Access denied. Admins only.");
        auth.signOut();
        window.location.href = "index.html";
        return;
    }

    // Show username instead of email
    document.getElementById("user-email").innerText = userData.username;

    // Load all requests
    loadRequests();
});

// --- Load all requests ---
function loadRequests() {
    const tbody = document.getElementById("requests-body");
    tbody.innerHTML = "";

    db.collection("Requests")
      .orderBy("timestamp", "desc")
      .get()
      .then(snapshot => {
          if(snapshot.empty){
              tbody.innerHTML = "<tr><td colspan='5'>No requests found.</td></tr>";
              return;
          }

          snapshot.forEach(doc => {
              const data = doc.data();
              const date = data.timestamp?.toDate().toLocaleString() || "";
              const statusText = data.status ? Object.values(data.status).join(", ") : "Pending";

              const row = `<tr>
                  <td>${date}</td>
                  <td>${data.submittedBy}</td>
                  <td>${data.department}</td>
                  <td>${data.location}</td>
                  <td>${statusText}</td>
              </tr>`;
              tbody.innerHTML += row;
          });
      })
      .catch(error => {
          console.error("Error loading requests:", error);
          tbody.innerHTML = "<tr><td colspan='5'>Error loading requests.</td></tr>";
      });
}

// --- Logout function ---
function logout() {
    auth.signOut().catch(error => alert("Error logging out: " + error.message));
}
</script>

</body>
</html>
