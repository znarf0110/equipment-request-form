<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body { font-family: Arial; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.container { background:white; padding:30px; border-radius:10px; width:400px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
input { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
button { width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
#message { margin-top:15px; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="login-btn">Login</button>
    <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
// ---------------- LOGIN FUNCTION ----------------
const loginBtn = document.getElementById("login-btn");
const msg = document.getElementById("message");

loginBtn.addEventListener("click", async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!username || !password){
        msg.innerText = "Please enter both username and password.";
        msg.style.color = "red";
        return;
    }

    msg.innerText = "Logging in...";
    msg.style.color = "black";

    try {
        // 1️⃣ Look up the user by username in Firestore
        const snapshot = await db.collection("Accounts").where("username", "==", username).limit(1).get();
        if(snapshot.empty) throw { code: "user-not-found" };

        const userData = snapshot.docs[0].data();
        const email = userData.email; // get the registered email

        // 2️⃣ Sign in with Firebase Auth using email & password
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // 3️⃣ Redirect based on role
        switch(userData.role){
            case "requestor":
                window.location.href = "requestor.html";
                break;
            case "approver":
                window.location.href = "approver.html";
                break;
            case "admin":
                window.location.href = "admin.html";
                break;
            default:
                throw new Error("Role not assigned.");
        }
    } catch(error){
        console.error(error);
        if(error.code==="auth/wrong-password" || error.code==="user-not-found"){
            msg.innerText = "Invalid credentials.";
        } else {
            msg.innerText = error.message;
        }
        msg.style.color = "red";
    }
});
</script>

</body>
</html>
