<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login</title>
<style>
/* Basic Styles for Clarity */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    margin: 0;
}
.container {
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
}
h2 { margin-bottom: 25px; }
input {
    width: calc(100% - 24px); 
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; 
}
button {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}
#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>Secure Login</h2>

    <input type="text" required id="username" placeholder="Username">
    
    <input type="password" required id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>
    
    </div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<!-- Your Firebase Config -->
<script src="firebase.js"></script>

<script>
// Wrap in window.onload to ensure DOM elements exist
window.onload = () => {

    window.login = function() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const msg = document.getElementById("message");

        if (!username || !password) {
            msg.innerHTML = "Please enter both username and password.";
            msg.style.color = "red";
            return;
        }

        msg.innerHTML = "Checking username...";
        msg.style.color = "black";

        // Lookup email using username
        db.collection("Accounts")
          .where("username", "==", username)
          .limit(1)
          .get()
          .then(snapshot => {
              if (snapshot.empty) throw { code: "username-not-found" };

              const userDoc = snapshot.docs[0].data();
              const email = userDoc.email;

              msg.innerHTML = "Verifying password...";
              msg.style.color = "black";

              return auth.signInWithEmailAndPassword(email, password);
          })
          .then(() => {
              window.location.href = "requestor.html";
          })
          .catch(error => {
              console.error("Firebase Auth Error:", error);

              let errorText = "Invalid username or password.";

              switch(error.code){
                  case "username-not-found": errorText = "Username not found."; break;
                  case "auth/wrong-password": errorText = "Incorrect password."; break;
                  case "auth/user-not-found": errorText = "Account does not exist."; break;
                  case "auth/too-many-requests": errorText = "Too many failed attempts. Try again later."; break;
                  default: if(error.message) errorText = error.message;
              }

              msg.innerHTML = errorText;
              msg.style.color = "red";
          });
    }
}
</script>


	
</body>

</html>
