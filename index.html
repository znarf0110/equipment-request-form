<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firebase Passwordless Login</title>
<style>
/* Basic Styles for Clarity */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    margin: 0;
}
.container {
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
}
h2 { margin-bottom: 25px; }
input {
    width: calc(100% - 24px); 
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; 
}
button {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}
#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>Login (Email Link)</h2>

    <input type="email" required id="user-email" placeholder="Your Email Address">

    <button onclick="sendSignInLink()">Login</button>

    <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script src="firebase.js"></script>

<script>
// !!! IMPORTANT: Replace this URL with your actual deployed dashboard URL !!!
const actionCodeSettings = {
    // This must match the URL you authorized in the Firebase console settings.
    url: 'https://znarf0110.github.io/equipment-request-form/requestor-dashboard.html', 
    handleCodeInApp: true,
};

/**
 * 1. Sends the email link to the user's provided email.
 */
function sendSignInLink() {
    const email = document.getElementById("user-email").value.trim(); 
    const messageElement = document.getElementById("message");

    if (!email) {
        messageElement.innerHTML = "Please enter a valid email address.";
        messageElement.style.color = "red";
        return;
    }

    messageElement.innerHTML = "Sending magic link...";
    messageElement.style.color = "black";

    auth.sendSignInLinkToEmail(email, actionCodeSettings)
        .then(() => {
            // Save email locally for when the user returns from the email click
            window.localStorage.setItem('emailForSignIn', email);
            messageElement.innerHTML = `Success! Check your email (${email}) for the magic link.`;
            messageElement.style.color = "green";
        })
        .catch((error) => {
            messageElement.innerHTML = "Error sending link: " + error.message;
            messageElement.style.color = "red";
        });
}


/**
 * 2. Checks if the user is returning from a magic link click to complete the sign-in.
 */
function handleSignInLink() {
    // Check if the current URL contains the sign-in data
    if (auth.isSignInWithEmailLink(window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn');
        
        // If email is missing, ask the user to input it
        if (!email) {
            email = window.prompt('Please provide your email for confirmation');
        }

        if (!email) {
            alert("Sign-in failed. Email is required.");
            return;
        }

        // Complete the sign-in process
        auth.signInWithEmailLink(email, window.location.href)
            .then(() => {
                // Sign-in successful. Redirect to the dashboard
                window.localStorage.removeItem('emailForSignIn');
                window.location.href = "dashboard.html"; 
            })
            .catch((error) => {
                alert("Sign-in error: " + error.message);
                window.location.href = "login.html"; 
            });
    }
}

// Execute the link handler on page load
handleSignInLink();
</script>

</body>
</html>
