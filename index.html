<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login</title>
<style>
/* Basic Styles for Clarity */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    margin: 0;
}
.container {
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
}
h2 { margin-bottom: 25px; }
input {
    width: calc(100% - 24px); 
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; 
}
button {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}
#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>Secure Login</h2>

    <input type="text" required id="username" placeholder="Username">
    
    <input type="password" required id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>
    
    </div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("message");

    // Basic validation
    if (!username || !password) {
        msg.innerHTML = "Please enter both username and password.";
        msg.style.color = "red";
        return;
    }

    msg.innerHTML = "Checking username...";
    msg.style.color = "black";

    // Step 1 — Lookup email using username
    db.collection("Accounts")
      .where("username", "==", username)
      .limit(1)
      .get()
      .then(snapshot => {
          if (snapshot.empty) {
              throw { code: "username-not-found" };
          }

          // Extract email from the user document
          const userDoc = snapshot.docs[0].data();
          const email = userDoc.email;

          msg.innerHTML = "Verifying password...";

          // Step 2 — Perform Firebase Auth login
          return auth.signInWithEmailAndPassword(email, password);
      })
      .then(() => {
          // Step 3 — Redirect to dashboard
          window.location.href = "requestor.html";
      })
      .catch(error => {
          let errorText = "Invalid username or password.";

          if (error.code === "username-not-found") {
              errorText = "Username not found.";
          }
          if (error.code === "auth/wrong-password") {
              errorText = "Incorrect password.";
          }
          if (error.code === "auth/user-not-found") {
              errorText = "Account does not exist.";
          }

          msg.innerHTML = errorText;
          msg.style.color = "red";
      });
}
</script>
	
</body>

</html>
