<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login</title>
<style>
/* Basic Styles for Clarity */
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    margin: 0;
}
.container {
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
}
h2 { margin-bottom: 25px; }
input {
    width: calc(100% - 24px); 
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; 
}
button {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}
#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>Secure Login</h2>

    <input type="text" required id="username" placeholder="Username">
    
    <input type="password" required id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>
    
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>
/**
 * Handles the login process:
 * 1. Queries Firestore (db) to find the email matching the username.
 * 2. Uses the found email and the provided password to authenticate via Firebase Auth (auth).
 */
function login() {
    const username = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    const messageElement = document.getElementById("message");
    
    messageElement.innerHTML = "Verifying credentials...";
    messageElement.style.color = "black"; 

    // Step 1: Find the email associated with the username in Firestore
    db.collection("users")
      .where("username", "==", username)
      .limit(1)
      .get()
      .then(snapshot => {
        if (snapshot.empty) {
          messageElement.innerHTML = "Error: Invalid username or account not found.";
          messageElement.style.color = "red";
          return;
        }

        // Get the email from the user document
        const doc = snapshot.docs[0];
        const email = doc.data().email;
        
        // Step 2: Authenticate using Firebase Auth (email + password)
        return auth.signInWithEmailAndPassword(email, pass);
      })
      .then(() => {
        // Success: Redirect the user
        window.location.href = "requestor.html"; 
      })
      .catch(error => {
        // Handle errors (e.g., Firestore query failed, password was wrong)
        let errorMessage = "Invalid username or password.";

        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
            errorMessage = "Invalid username or password.";
        } else if (error.message) {
             errorMessage = error.message;
        }

        messageElement.innerHTML = "Error: " + errorMessage;
        messageElement.style.color = "red";
      });
}
</script>

</body>
</html>
