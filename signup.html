<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup</title>
<style>
body { font-family: Arial; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.container { background:white; padding:30px; border-radius:10px; width:400px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
input, select { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
button { width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
#message { margin-top:15px; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
    <h2>Create Account</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    
    <select id="role" required onchange="toggleDepartment()">
        <option value="">Select Role</option>
        <option value="requestor">Requestor</option>
        <option value="approver">Approver</option>
        <option value="admin">Admin</option>
    </select>
    
    <!-- Department dropdown for approvers -->
    <select id="department" style="display:none;">
        <option value="">Select Department</option>
        <option value="Sales">Sales</option>
        <option value="Marketing">Marketing</option>
        <option value="HR">HR</option>
        <option value="Finance">Finance</option>
        <option value="IT">IT</option>
        <option value="Operations">Operations</option>
    </select>

    <button onclick="signupUser()">Sign Up</button>
    <p id="message"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
function toggleDepartment() {
    const role = document.getElementById("role").value;
    const deptInput = document.getElementById("department");
    if(role === "approver") {
        deptInput.style.display = "block";
        deptInput.required = true;
    } else {
        deptInput.style.display = "none";
        deptInput.required = false;
        deptInput.value = "";
    }
}

function isValidEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
}

function signupUser() {
    const username = document.getElementById("username").value.trim();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;
    const department = document.getElementById("department").value;
    const msg = document.getElementById("message");

    if(!username || !name || !email || !password || !role) {
        msg.innerText = "Please fill in all required fields.";
        msg.style.color = "red";
        return;
    }

    if(!isValidEmail(email)) {
        msg.innerText = "Please enter a valid email address.";
        msg.style.color = "red";
        return;
    }

    if(role === "approver" && !department) {
        msg.innerText = "Please select a department for approvers.";
        msg.style.color = "red";
        return;
    }

    msg.innerText = "Checking username/email...";
    msg.style.color = "black";

    // Check duplicate username
    db.collection("Accounts").where("username","==",username).get()
      .then(snapshot => {
          if(!snapshot.empty) throw { code:"username-exists" };
          // Check duplicate email
          return db.collection("Accounts").where("email","==",email).get();
      })
      .then(snapshot => {
          if(!snapshot.empty) throw { code:"email-exists" };
          // Create user
          return auth.createUserWithEmailAndPassword(email, password);
      })
      .then(userCredential => {
          const userId = userCredential.user.uid;
          return db.collection("Accounts").doc(userId).set({
              username,
              name,
              email,
              role,
              department: role==="approver"? department : "",
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
      })
      .then(() => {
          msg.innerText = "Account created successfully!";
          msg.style.color = "green";
          setTimeout(()=>window.location.href="index.html",1500);
      })
      .catch(error => {
          let text = "Error creating account.";
          if(error.code==="username-exists") text="Username already exists.";
          if(error.code==="email-exists") text="Email already registered.";
          if(error.code.startsWith("auth/")) text = error.message;
          msg.innerText = text;
          msg.style.color="red";
      });
}
</script>

</body>
</html>
