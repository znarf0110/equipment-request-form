<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Approver Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#f0f0f0;
  padding:20px;
}
.container {
  background:white;
  padding:20px;
  border-radius:10px;
  max-width:1400px;
  margin:auto;
}
.logout {
  float:right;
  background:#dc3545;
  color:white;
  border:none;
  padding:8px;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}
th, td {
  border:1px solid #ccc;
  padding:10px;
}
th {
  background:#007bff;
  color:white;
}
button {
  background:#28a745;
  color:white;
  border:none;
  padding:6px 10px;
}
</style>
</head>

<body>

<div class="container">
  <button class="logout" onclick="logout()">Logout</button>
  <div>Logged in as: <strong id="email"></strong></div>
  <h2>Approver Dashboard</h2>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Date Needed</th>
        <th>Department</th>
        <th>Location</th>
        <th>Submitted By</th>
        <th>Approved by Manager</th>
        <th>Approved by HR</th>
        <th>Approed by IT</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
let DEPT = "";
let POSITION = "";

auth.onAuthStateChanged(async user => {
    if (!user) return location.href="index.html";

    const snap = await db.collection("Accounts").doc(user.uid).get();
    const data = snap.data();

    if (!data || data.role !== "approver") return location.href="index.html";

    DEPT = data.department.toUpperCase();
    POSITION = data.position.toUpperCase();

    document.getElementById("email").innerText = data.username || user.email;
    loadRequests();
});

function loadRequests() {
    const key = `${DEPT}_${POSITION}`;
    const tbody = document.getElementById("tbody");

    db.collection("Requests")
      .where("approverKey", "==", key)
      .onSnapshot(snapshot => {
        tbody.innerHTML = "";
        
        if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;">No pending approvals for your role.</td></tr>`;
            return;
        }

        snapshot.forEach(doc => {
            const r = doc.data();
            const dateStr = r.timestamp ? r.timestamp.toDate().toLocaleDateString() : "Pending...";
            
            tbody.innerHTML += `
                <tr>
                    <td>${dateStr}</td>
                    <td>${r.name}</td>
                    <td>${r.dateNeeded}</td>
                    <td>${r.department}</td>
                    <td>${r.location}</td>
                    <td>${r.submittedBy}</td>
                    <td><span class="status-${r.status.approver1.toLowerCase()}">${r.status.approver1}</span></td>
                    <td><span class="status-${r.status.approver2.toLowerCase()}">${r.status.approver2}</span></td>
                    <td><span class="status-${r.status.final.toLowerCase()}">${r.status.final}</span></td>
                    <td>
                        <button onclick="approve('${doc.id}')">Approve</button>
                    </td>
                </tr>`;
        });
    });
}

async function approve(id) {
    const ref = db.collection("Requests").doc(id);
    
    try {
        if (POSITION === "MANAGER") {
            await ref.update({
                "status.approver1": "Approved",
                currentApprover: "HR",
                approverKey: `${DEPT}_HR`
            });
        } else if (POSITION === "HR") {
            await ref.update({
                "status.approver2": "Approved",
                currentApprover: "ADMIN",
                approverKey: `${DEPT}_ADMIN` // Or use a global ADMIN key if ADMIN isn't dept-specific
            });
        } else if (POSITION === "ADMIN") {
            await ref.update({
                "status.final": "Approved",
                currentApprover: "DONE",
                approverKey: "COMPLETED"
            });
        }
        alert("Request Approved!");
    } catch (error) {
        console.error("Error updating document: ", error);
    }
}

function logout() {
    auth.signOut().then(() => location.href="index.html");
}
</script>
</body>
</html>
