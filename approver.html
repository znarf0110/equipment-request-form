<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Approver Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#f0f0f0;
  padding:20px;
}
.container {
  background:white;
  padding:20px;
  border-radius:10px;
  max-width:1200px;
  margin:auto;
}
.logout-btn {
  float:right;
  background:#dc3545;
  color:white;
  border:none;
  padding:8px;
  border-radius:6px;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:40px;
}
th, td {
  border:1px solid #ccc;
  padding:10px;
}
th {
  background:#007bff;
  color:white;
}
button {
  background:#28a745;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:4px;
}
</style>
</head>

<body>

<div class="container">
  <button class="logout-btn" onclick="logout()">Logout</button>
  <div>Logged in as: <strong id="user-email">...</strong></div>
  <h2>Approver Dashboard</h2>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Date Needed</th>
        <th>Department</th>
        <th>Location</th>
        <th>Submitted By</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="requests"></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
let currentDept = "";
let currentPosition = "";

auth.onAuthStateChanged(async user => {
  if (!user) return location.href = "index.html";

  const doc = await db.collection("Accounts").doc(user.uid).get();
  const data = doc.data();

  if (!data || data.role !== "approver")
    return location.href = "index.html";

  document.getElementById("user-email").innerText =
    data.username || user.email;

  currentDept = data.department.toUpperCase();
  currentPosition = data.position; // Manager / HR / Admin

  loadRequests();
});

function loadRequests() {
  const approverKey = `${currentDept}_${currentPosition}`;

  db.collection("Requests")
    .where("approverKey", "==", approverKey)
    .orderBy("timestamp", "desc")
    .onSnapshot(snapshot => {
      const tbody = document.getElementById("requests");
      tbody.innerHTML = "";

      snapshot.forEach(doc => {
        const r = doc.data();
        tbody.innerHTML += `
          <tr>
            <td>${r.timestamp?.toDate().toLocaleString()}</td>
            <td>${r.name}</td>
            <td>${r.dateNeeded}</td>
            <td>${r.department}</td>
            <td>${r.location}</td>
            <td>${r.submittedBy}</td>
            <td>${r.status.approver1}</td>
            <td>
              <button onclick="approve('${doc.id}')">Approve</button>
            </td>
          </tr>
        `;
      });
    });
}

function approve(id) {
  const ref = db.collection("Requests").doc(id);

  if (currentPosition === "Manager") {
    ref.update({
      "status.approver1": "Approved",
      currentApprover: "HR",
      approverKey: `${currentDept}_HR`
    });
  } else if (currentPosition === "HR") {
    ref.update({
      "status.approver2": "Approved",
      currentApprover: "Admin",
      approverKey: `${currentDept}_ADMIN`
    });
  }
}

function logout() {
  auth.signOut();
  location.href = "index.html";
}
</script>
</body>
</html>
